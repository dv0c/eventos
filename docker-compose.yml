services:
  postgres:
    image: postgres:16-alpine
    container_name: eventos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos
    ports:
      - "5432:5432"
    volumes:
      - eventos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eventos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eventos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: eventos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eventos
      MINIO_ROOT_PASSWORD: eventos123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eventos_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: eventos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set eventos http://minio:9000 eventos eventos123456;
      mc mb eventos/eventos-uploads --ignore-existing;
      mc anonymous set download eventos/eventos-uploads;
      exit 0;
      "

volumes:
  eventos_postgres_data:
  eventos_redis_data:
  eventos_minio_data:
